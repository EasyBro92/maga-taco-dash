<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>MAGA Taco Dash</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#c99a2e" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Taco Dash" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/icon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="loadingScreen">
  <div class="loadingLogo">🌮</div>
  <div class="loadingBar"><div class="loadingBarFill"></div></div>
  <div class="loadingText" data-i18n="loading">Cargando...</div>
</div>
<div id="webglError" class="hidden">
  <div class="loadingLogo">⚠️</div>
  <p data-i18n="webglUnsupported">Tu dispositivo no soporta este juego (falta WebGL).</p>
</div>
<div id="stage">
  <canvas id="game"></canvas>
  <div id="speedLines"></div>

  <div id="hud" class="hidden">
    <div id="hudTacos"><span class="icon">🌮</span><span id="hudTacoCount">0</span><span id="hudStreak" class="hidden"></span></div>
    <div id="hudScore"><span id="hudScoreValue">0</span> m</div>
    <button id="langToggle" class="smallBtn">EN</button>
  </div>

  <div id="powerupBadge" class="hidden"></div>
  <div id="bossBar" class="hidden"><div class="bossName">🌯 BURRITO-BOT</div><div class="bossTrack"><div id="bossFill"></div></div></div>
  <div id="misionToast" class="hidden"></div>
  <div id="bannerNivel" class="hidden"><div class="bnNumero"></div><div class="bnNombre"></div><div class="bnLugar"></div></div>

  <div id="mapaGira" class="overlay hidden">
    <div class="card wide">
      <div class="title small">🗺️ <span data-i18n="gira">La gira</span></div>
      <svg id="mapaSvg" viewBox="0 0 100 62" class="mapaSvg"></svg>
      <div id="mapaInfo" class="mapaInfo"></div>
      <button id="mapaCerrar" class="smallBtn" data-i18n="close">Cerrar</button>
    </div>
  </div>

  <div id="nivelFin" class="overlay hidden">
    <div class="card">
      <h2 class="title small" id="nivelFinTitulo"></h2>
      <div class="estrellas" id="nivelFinEstrellas"></div>
      <p class="statLine"><span class="icon">🌮</span> <span id="nivelFinTacos">0</span></p>
      <div class="misiones" id="misionesNivel"></div>
      <button id="nivelFinMapa" class="bigBtn" data-i18n="mapa">MAPA</button>
      <button id="nivelFinRepetir" class="smallBtn" data-i18n="repetir">Repetir</button>
    </div>
  </div>
  <div id="speechBubble" class="hidden"></div>
  <div id="confettiLayer"></div>

  <!-- Menu de inicio (25/10/2026): panel claro abajo, el presidente se ve arriba. -->
  <div id="startScreen" class="overlay inicio">
    <div class="logo">
      <div class="logoMaga">MAGA</div>
      <div class="logoTaco">TACO DASH <span class="logoTacoIcono">🌮</span></div>
    </div>
    <div class="card hoja">
      <div class="misiones" id="misionesMenu"></div>
      <button id="startBtn" class="bigBtn" data-i18n="play">JUGAR</button>
      <div class="filaInicio">
        <button id="sinFinBtn" class="smallBtn ancho" data-i18n="sinFin">♾️ Sin fin</button>
        <button id="startShopBtn" class="smallBtn" data-i18n="shop">🛒 Tienda</button>
        <button id="startRankBtn" class="smallBtn" data-i18n="ranking">🌍 Ranking</button>
        <button id="startLangBtn" class="redondo" aria-label="Idioma">🌐</button>
        <button id="startSettingsBtn" class="redondo" aria-label="Ajustes">⚙️</button>
      </div>
    </div>
  </div>

  <!-- Sin fin: aqui se elige la zona (antes estaba en el inicio y lo cargaba). -->
  <div id="sinFinOverlay" class="overlay hidden">
    <div class="card">
      <div class="title small" data-i18n="sinFin">♾️ Sin fin</div>
      <div class="zoneLabel" data-i18n="zone">Zona</div>
      <div class="zonas" id="zoneButtons">
        <button class="zoneBtn" data-zone="auto" data-i18n="zoneAuto">🎲 Auto</button>
        <button class="zoneBtn" data-zone="city" data-i18n="zoneCity">🏙️ Ciudad</button>
        <button class="zoneBtn" data-zone="desert" data-i18n="zoneDesert">🌵 Desierto</button>
        <button class="zoneBtn" data-zone="town" data-i18n="zoneTown">🏘️ Pueblo</button>
        <button class="zoneBtn" data-zone="dc" data-i18n="zoneDc">🏛️ Washington D.C.</button>
      </div>
      <button id="sinFinCorrer" class="bigBtn" data-i18n="play">JUGAR</button>
      <button id="sinFinCerrar" class="smallBtn" data-i18n="close">Cerrar</button>
    </div>
  </div>

  <div id="settingsOverlay" class="overlay hidden">
    <div class="card">
      <div class="title small" data-i18n="settings">Ajustes</div>

      <div class="ajuste">
        <span class="ajusteIcono">🎵</span>
        <label data-i18n="music">Música</label>
        <input id="musicVolRange" type="range" min="0" max="100" value="80" />
        <button id="musicMuteBtn" class="redondo pequeno">🔊</button>
      </div>
      <div class="ajuste">
        <span class="ajusteIcono">🔔</span>
        <label data-i18n="sfx">Sonido</label>
        <input id="sfxVolRange" type="range" min="0" max="100" value="80" />
        <button id="sfxMuteBtn" class="redondo pequeno">🔊</button>
      </div>
      <div class="ajuste">
        <span class="ajusteIcono">👆</span>
        <label data-i18n="sensitivity">Sensibilidad</label>
        <input id="sensitivityRange" type="range" min="15" max="45" value="28" />
      </div>
      <div class="ajuste columna">
        <div class="ajusteTitulo"><span class="ajusteIcono">🌐</span><label data-i18n="language">Idioma</label></div>
        <div class="segmentos">
          <button id="settingsLangEs" class="segmento">Español</button>
          <button id="settingsLangEn" class="segmento">English</button>
        </div>
      </div>
      <div class="ajuste columna">
        <div class="ajusteTitulo"><span class="ajusteIcono">✨</span><label data-i18n="quality">Gráficos</label></div>
        <div class="segmentos">
          <button id="qualityLow" class="segmento" data-i18n="qualityLow">Baja</button>
          <button id="qualityMedium" class="segmento" data-i18n="qualityMedium">Media</button>
          <button id="qualityHigh" class="segmento" data-i18n="qualityHigh">Alta</button>
        </div>
      </div>

      <button id="settingsClose" class="bigBtn" data-i18n="close">Cerrar</button>
      <button id="resetProgressBtn" class="enlaceRojo" data-i18n="resetProgress">Borrar progreso</button>
    </div>
  </div>

  <div id="gameOverScreen" class="overlay hidden">
    <div class="card">
      <h2 class="title small" data-i18n="gameOver">¡Te atraparon!</h2>
      <p class="statLine"><span data-i18n="distance">Distancia</span>: <span id="finalScore">0</span> m</p>
      <p class="statLine"><span class="icon">🌮</span> <span id="finalTacos">0</span></p>
      <p class="statLine best" id="bestLine"></p>
      <div class="misiones" id="misionesFin"></div>
      <button id="retryBtn" class="bigBtn" data-i18n="retry">REINTENTAR</button>
      <button id="menuBtn" class="smallBtn" data-i18n="menu">Menú</button>
    </div>
  </div>

  <div id="nameOverlay" class="overlay hidden">
    <div class="card">
      <div class="title small">🎉 <span data-i18n="newRecord">¡Nuevo récord!</span></div>
      <p class="subtitle" data-i18n="whatsYourName">¿Cómo te llamas?</p>
      <input id="nameInput" type="text" maxlength="12" autocomplete="off" placeholder="Tu nombre" />
      <button id="nameSubmit" class="bigBtn" data-i18n="save">Guardar</button>
    </div>
  </div>

  <div id="leaderboardOverlay" class="overlay hidden">
    <div class="card">
      <div class="title small">🌍 <span data-i18n="worldRanking">Ranking mundial</span></div>
      <ol id="leaderboardList" class="lbList"><li class="lbEmpty">…</li></ol>
      <button id="leaderboardClose" class="smallBtn" data-i18n="close">Cerrar</button>
    </div>
  </div>

  <div id="shopOverlay" class="overlay hidden">
    <div class="card wide">
      <div class="title small">🛒 <span data-i18n="shop">Tienda</span></div>
      <div class="shopTacos"><span class="icon">🌮</span> <span id="shopTacoCount">0</span></div>
      <div id="shopGrid" class="shopGrid"></div>
      <button id="shopClose" class="smallBtn" data-i18n="close">Cerrar</button>
    </div>
  </div>

  <div id="touchControls"></div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
