<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Esquí en Denver · prueba</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<style>
  @font-face { font-family: "Fredoka"; font-weight: 300 700; font-display: swap; src: url(fonts/fredoka.woff2) format("woff2"); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1c2a4a; touch-action: none; }
  /* 16/11/2026: en vertical, como el juego (en el PC, una columna en el centro).
     24/11: el esquí ya está dentro del juego (nivel 29, Denver); esta página
     es la bajada sin fin para probarlo suelto. */
  #juego { position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); width: min(100vw, 56vh); overflow: hidden; background: #8ec8ec; }
  #carga { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font: 24px Fredoka, Arial, sans-serif; background: #8ec8ec; z-index: 9; }
</style>
</head>
<body>
<div id="juego"><div id="carga">Cargando la montaña…</div></div>
<script type="module">
  import { montarEsqui } from "./src/esqui2d.js";
  const esqui = await montarEsqui(document.getElementById("juego"));
  document.getElementById("carga").remove();
  esqui.empezar();
</script>
</body>
</html>
