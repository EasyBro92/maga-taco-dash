# Publica la carpeta www/ (el juego tal cual, no hay que compilar) en
# https://easybro92.github.io/maga-taco-dash/ cada vez que se sube a main.
name: Publicar el juego

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: despliegue
        uses: actions/deploy-pages@v4
